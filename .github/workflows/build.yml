name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile main.py
      - uses: actions/upload-artifact@v4
        with:
          name: mahdi-auto-diag-exe
          path: dist/main.exe
